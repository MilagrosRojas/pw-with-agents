name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - name: Install dependencies
      run: npm ci
    - name: Install Chromium for Playwright
      run: npx playwright install --with-deps chromium
    - name: Run products-cart tests in Chromium
      run: npx playwright test tests/products-cart --project=chromium
    - name: Generate Allure report
      if: ${{ always() }}
      run: npm run allure:generate
    - uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
        if-no-files-found: warn
    - uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: test-results
        path: test-results/
        retention-days: 30
        if-no-files-found: warn
    - uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: allure-results
        path: allure-results/
        retention-days: 30
        if-no-files-found: warn
    - uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30
        if-no-files-found: warn
